<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞书 Markdown 公式格式转换</title>
  <style>
    body { margin: 0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background: #f5f7fb; color: #1f2937; }
    .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; height: 100vh; box-sizing: border-box; }
    .panel { background: #fff; border: 1px solid #dbe2f0; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; min-height: 0; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    textarea { flex: 1; width: 100%; resize: none; border: 1px solid #cfd8ea; border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; box-sizing: border-box; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
    button { border: 1px solid #c6d2eb; background: #eef3ff; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
    button:hover { background: #dde8ff; }
    @media (max-width: 960px) { .wrap { grid-template-columns: 1fr; height: auto; } .panel { min-height: 42vh; } }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h2>输入（粘贴原始文本）</h2>
      <div class="toolbar">
        <button id="convertBtn">转换</button>
        <button id="clearBtn">清空</button>
      </div>
      <textarea id="input" placeholder="在这里粘贴原始文本..."></textarea>
    </section>
    <section class="panel">
      <h2>输出（飞书可粘贴 Markdown）</h2>
      <div class="toolbar">
        <button id="copyBtn">复制输出</button>
      </div>
      <textarea id="output" readonly placeholder="转换结果将显示在这里..."></textarea>
    </section>
  </div>

  <script src="./converter.js"></script>
  <script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const convert = () => { outputEl.value = window.convertToFeishuMarkdown(inputEl.value); };
    document.getElementById('convertBtn').addEventListener('click', convert);
    document.getElementById('clearBtn').addEventListener('click', () => { inputEl.value = ''; outputEl.value = ''; });
    document.getElementById('copyBtn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(outputEl.value || '');
    });
    inputEl.addEventListener('input', convert);
  </script>
</body>
</html>
